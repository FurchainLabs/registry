name: Auto-merge validated registrations

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'registration'
    steps:
      - name: Auto-merge
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const pr = context.payload.pull_request;

            console.log(`PR #${prNumber}: has "registration" label, checking validation status...`);

            // Wait briefly for checks to settle
            await new Promise(r => setTimeout(r, 5000));

            // Verify the validate check passed
            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: pr.head.sha,
            });
            const validateCheck = checks.check_runs.find(c => c.name === 'validate');
            if (!validateCheck || validateCheck.conclusion !== 'success') {
              console.log(`PR #${prNumber}: validation check not passed (${validateCheck?.conclusion || 'not found'}), skipping`);
              return;
            }
            console.log(`PR #${prNumber}: validation passed`);

            // Approve
            try {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                event: 'APPROVE',
                body: 'Auto-approved: all validation checks passed.',
              });
              console.log(`PR #${prNumber}: approved`);
            } catch (e) {
              console.log(`PR #${prNumber}: approve skipped: ${e.message}`);
            }

            // Merge
            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                merge_method: 'squash',
                commit_title: `${pr.title}`,
              });
              console.log(`PR #${prNumber}: merged`);
            } catch (e) {
              console.log(`PR #${prNumber}: merge failed: ${e.message}`);
            }
