name: Auto-merge validated registrations

on:
  workflow_run:
    workflows: ["Validate Registry PR"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Find and merge validated registration PRs
        uses: actions/github-script@v7
        with:
          script: |
            // Get PRs associated with this workflow run
            const runId = context.payload.workflow_run.id;
            const headSha = context.payload.workflow_run.head_sha;
            const headBranch = context.payload.workflow_run.head_branch;

            console.log(`Workflow run ${runId} succeeded on branch ${headBranch} (${headSha})`);

            // Find open PRs from this branch
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.payload.workflow_run.head_repository.owner.login}:${headBranch}`,
            });

            if (prs.length === 0) {
              console.log('No open PRs found for this branch');
              return;
            }

            for (const pr of prs) {
              console.log(`\nProcessing PR #${pr.number}: ${pr.title}`);

              // Verify this is a registration PR (only touches v1/by-id/)
              const { data: files } = await github.rest.pulls.listFiles({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
              });

              const registryFiles = files.filter(f =>
                f.filename.startsWith('v1/by-id/') && f.filename.endsWith('.json')
              );
              const nonRegistryFiles = files.filter(f =>
                !f.filename.startsWith('v1/by-id/')
              );

              if (registryFiles.length === 0) {
                console.log('  No registry entries, skipping');
                continue;
              }
              if (nonRegistryFiles.length > 0) {
                console.log('  Contains non-registry changes, skipping auto-merge');
                continue;
              }

              // Add registration label
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  labels: ['registration'],
                });
                console.log('  Labeled as registration');
              } catch (e) {
                console.log(`  Label failed: ${e.message}`);
              }

              // Approve
              try {
                await github.rest.pulls.createReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  event: 'APPROVE',
                  body: 'Auto-approved: all validation checks passed.',
                });
                console.log('  Approved');
              } catch (e) {
                console.log(`  Approve skipped: ${e.message}`);
              }

              // Merge
              try {
                await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  merge_method: 'squash',
                  commit_title: pr.title,
                });
                console.log('  Merged');
                core.setOutput('merged', 'true');
              } catch (e) {
                console.log(`  Merge failed: ${e.message}`);
              }
            }

  rebuild-indexes:
    needs: auto-merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Rebuild derived indexes
        run: |
          node << 'SCRIPT'
          const fs = require('fs');
          const path = require('path');

          const byIdDir = 'v1/by-id';
          const byNameDir = 'v1/derived/by-name';
          const byOwnerDir = 'v1/derived/by-owner';

          for (const dir of [byNameDir, byOwnerDir]) {
            for (const f of fs.readdirSync(dir)) {
              if (f === '.gitkeep') continue;
              fs.unlinkSync(path.join(dir, f));
            }
          }

          const entries = [];
          for (const f of fs.readdirSync(byIdDir)) {
            if (f === '.gitkeep' || !f.endsWith('.json')) continue;
            try {
              const entry = JSON.parse(fs.readFileSync(path.join(byIdDir, f), 'utf-8'));
              entries.push(entry);
            } catch (e) {
              console.error(`Warning: skipping ${f}: ${e.message}`);
            }
          }

          console.log(`Processing ${entries.length} registry entries`);

          const byName = new Map();
          const byOwner = new Map();
          for (const entry of entries) {
            if (!byName.has(entry.name)) byName.set(entry.name, []);
            byName.get(entry.name).push(entry);
            if (!byOwner.has(entry.owner)) byOwner.set(entry.owner, []);
            byOwner.get(entry.owner).push(entry);
          }

          for (const [name, nameEntries] of byName) {
            const sorted = nameEntries.sort((a, b) => a.registered.localeCompare(b.registered));
            fs.writeFileSync(path.join(byNameDir, `${name}.json`), JSON.stringify(sorted, null, 2) + '\n');
          }
          console.log(`Wrote ${byName.size} by-name indexes`);

          for (const [owner, ownerEntries] of byOwner) {
            const sorted = ownerEntries.sort((a, b) => a.name.localeCompare(b.name));
            fs.writeFileSync(path.join(byOwnerDir, `${owner}.json`), JSON.stringify(sorted, null, 2) + '\n');
          }
          console.log(`Wrote ${byOwner.size} by-owner indexes`);
          SCRIPT

      - name: Commit and push derived indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add v1/derived/
          if git diff --cached --quiet; then
            echo "No changes to derived indexes"
          else
            git commit -m "chore: rebuild derived indexes"
            git push
          fi
