name: Process Deregistration

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  process:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.body, '<!-- furchain-deregistration')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Add deregistration label
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: ['deregistration'],
            });

      - name: Extract and process deregistration
        id: process
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const issue = context.payload.issue;
            const body = issue.body || '';
            const issueAuthor = issue.user.login;

            // 1. Extract JSON from HTML comment
            const match = body.match(/<!-- furchain-deregistration\s+([\s\S]*?)\s+furchain-deregistration -->/);
            if (!match) {
              core.setFailed('No deregistration payload found in issue body');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '**Processing failed:** No `furchain-deregistration` payload found in the issue body.',
              });
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['validation-failed'],
              });
              return;
            }

            let payload;
            try {
              payload = JSON.parse(match[1].trim());
            } catch (e) {
              core.setFailed(`Invalid JSON in deregistration payload: ${e.message}`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `**Processing failed:** Invalid JSON in deregistration payload.\n\n\`\`\`\n${e.message}\n\`\`\``,
              });
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['validation-failed'],
              });
              return;
            }

            // 2. Verify entry exists
            const entryPath = path.join('v1', 'by-id', `${payload.id}.json`);
            if (!fs.existsSync(entryPath)) {
              core.setFailed(`Entry ${payload.id} not found`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `**Processing failed:** No registry entry found for ID \`${payload.id}\`.`,
              });
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['validation-failed'],
              });
              return;
            }

            const entry = JSON.parse(fs.readFileSync(entryPath, 'utf-8'));

            // 3. Authorization: issue author must be the entry owner
            if (issueAuthor !== entry.owner) {
              core.setFailed(`Unauthorized: issue author "${issueAuthor}" does not match entry owner "${entry.owner}"`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `**Processing failed:** Only the character owner (@${entry.owner}) can request deregistration.`,
              });
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['validation-failed'],
              });
              return;
            }

            // 4. Check if already inactive
            if (entry.status === 'inactive') {
              core.setFailed('Entry is already inactive');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `**Processing failed:** This character is already deregistered.`,
              });
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['validation-failed'],
              });
              return;
            }

            // 5. Update entry with inactive status
            const updated = { ...entry, status: 'inactive' };
            fs.writeFileSync(entryPath, JSON.stringify(updated, null, 2) + '\n');

            core.setOutput('entry_path', entryPath);
            core.setOutput('entry_name', entry.name);
            core.setOutput('entry_display', entry.display);
            core.setOutput('issue_number', issue.number);

      - name: Commit entry
        if: steps.process.outputs.entry_path != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.process.outputs.entry_path }}"
          git commit -m "chore: deregister ${{ steps.process.outputs.entry_name }}"
          git push

      - name: Rebuild derived indexes
        if: steps.process.outputs.entry_path != ''
        run: |
          node << 'SCRIPT'
          const fs = require('fs');
          const path = require('path');

          const byIdDir = 'v1/by-id';
          const byNameDir = 'v1/derived/by-name';
          const byOwnerDir = 'v1/derived/by-owner';

          for (const dir of [byNameDir, byOwnerDir]) {
            for (const f of fs.readdirSync(dir)) {
              if (f === '.gitkeep') continue;
              fs.unlinkSync(path.join(dir, f));
            }
          }

          const allEntries = [];
          for (const f of fs.readdirSync(byIdDir)) {
            if (f === '.gitkeep' || !f.endsWith('.json')) continue;
            try {
              allEntries.push(JSON.parse(fs.readFileSync(path.join(byIdDir, f), 'utf-8')));
            } catch (e) {
              console.error(`Warning: skipping malformed file ${f}: ${e.message}`);
            }
          }

          const entries = allEntries.filter(e => !e.status || e.status === 'active');
          console.log(`Processing ${entries.length} active entries (${allEntries.length} total)`);

          const byName = new Map();
          const byOwner = new Map();
          for (const entry of entries) {
            if (!byName.has(entry.name)) byName.set(entry.name, []);
            byName.get(entry.name).push(entry);
            if (!byOwner.has(entry.owner)) byOwner.set(entry.owner, []);
            byOwner.get(entry.owner).push(entry);
          }

          for (const [name, nameEntries] of byName) {
            const sorted = nameEntries.sort((a, b) => a.registered.localeCompare(b.registered));
            fs.writeFileSync(path.join(byNameDir, `${name}.json`), JSON.stringify(sorted, null, 2) + '\n');
          }
          for (const [owner, ownerEntries] of byOwner) {
            const sorted = ownerEntries.sort((a, b) => a.name.localeCompare(b.name));
            fs.writeFileSync(path.join(byOwnerDir, `${owner}.json`), JSON.stringify(sorted, null, 2) + '\n');
          }

          console.log(`Wrote ${byName.size} by-name and ${byOwner.size} by-owner indexes`);
          SCRIPT

      - name: Commit and push indexes
        if: steps.process.outputs.entry_path != ''
        run: |
          git add v1/derived/
          if git diff --cached --quiet; then
            echo "No changes to derived indexes"
          else
            git commit -m "chore: rebuild derived indexes"
            git push
          fi

      - name: Close issue with success
        if: steps.process.outputs.entry_path != ''
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = ${{ steps.process.outputs.issue_number }};
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `**Deregistration approved.** ${{ steps.process.outputs.entry_display }} has been deregistered. The entry remains accessible by ID but is removed from search indexes.`,
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['approved'],
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed',
            });
