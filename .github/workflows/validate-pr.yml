name: Validate Registry PR

on:
  pull_request:
    paths:
      - 'v1/by-id/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Find new/changed entry files
        id: entries
        run: |
          FILES=$(git diff --name-only --diff-filter=A origin/main...HEAD -- 'v1/by-id/*.json' | grep -v '.gitkeep' || true)
          if [ -z "$FILES" ]; then
            echo "No new registry entries found."
            exit 0
          fi
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Install validation dependencies
        if: steps.entries.outputs.files != ''
        run: npm install ajv@8 ajv-formats@3

      - name: Validate entries
        if: steps.entries.outputs.files != ''
        run: |
          node << 'SCRIPT'
          const fs = require('fs');
          const path = require('path');
          const Ajv2020 = require('ajv/dist/2020');
          const addFormats = require('ajv-formats');

          const ajv = new Ajv2020({ allErrors: true });
          addFormats(ajv);
          const schema = JSON.parse(fs.readFileSync('v1/registry-entry.schema.json', 'utf-8'));
          const validate = ajv.compile(schema);

          const files = process.env.ENTRY_FILES.split('\n').filter(Boolean);
          const existingIds = new Set();

          // Load all existing entries for uniqueness check
          const byIdDir = 'v1/by-id';
          for (const f of fs.readdirSync(byIdDir)) {
            if (f === '.gitkeep' || !f.endsWith('.json')) continue;
            try {
              const entry = JSON.parse(fs.readFileSync(path.join(byIdDir, f), 'utf-8'));
              existingIds.add(entry.id);
            } catch {}
          }

          let hasErrors = false;

          for (const file of files) {
            console.log(`\nValidating: ${file}`);
            let entry;
            try {
              entry = JSON.parse(fs.readFileSync(file, 'utf-8'));
            } catch (e) {
              console.error(`  FAIL: Invalid JSON - ${e.message}`);
              hasErrors = true;
              continue;
            }

            // 1. Schema validation
            const valid = validate(entry);
            if (!valid) {
              console.error(`  FAIL: Schema validation errors:`);
              for (const err of validate.errors) {
                console.error(`    - ${err.instancePath || '(root)'}: ${err.message}`);
              }
              hasErrors = true;
              continue;
            }
            console.log('  OK: Schema valid');

            // 2. Filename must match ID
            const expectedFilename = `${entry.id}.json`;
            const actualFilename = path.basename(file);
            if (actualFilename !== expectedFilename) {
              console.error(`  FAIL: Filename "${actualFilename}" does not match id "${entry.id}"`);
              hasErrors = true;
              continue;
            }
            console.log('  OK: Filename matches ID');

            // 3. ID uniqueness (check against other entries in the same PR)
            // existingIds already includes files from this PR since we read the full directory
            // We check for duplicates by counting occurrences
            const idCount = files.filter(f2 => {
              try {
                const e2 = JSON.parse(fs.readFileSync(f2, 'utf-8'));
                return e2.id === entry.id;
              } catch { return false; }
            }).length;
            if (idCount > 1) {
              console.error(`  FAIL: Duplicate ID "${entry.id}" found in this PR`);
              hasErrors = true;
              continue;
            }
            console.log('  OK: ID unique');

            console.log(`  PASS: ${entry.display} (${entry.name}) by @${entry.owner}`);
          }

          if (hasErrors) {
            process.exit(1);
          }
          console.log('\nAll entries validated successfully.');
          SCRIPT
        env:
          ENTRY_FILES: ${{ steps.entries.outputs.files }}

      - name: Verify remote repositories
        if: steps.entries.outputs.files != ''
        run: |
          node << 'SCRIPT'
          const fs = require('fs');
          const { execSync } = require('child_process');

          const files = process.env.ENTRY_FILES.split('\n').filter(Boolean);
          let hasErrors = false;

          for (const file of files) {
            const entry = JSON.parse(fs.readFileSync(file, 'utf-8'));
            const repoUrl = `https://api.github.com/repos/${entry.owner}/${entry.repo}`;
            console.log(`\nVerifying: ${entry.owner}/${entry.repo}`);

            try {
              // Check repo exists and is public
              const repoResponse = execSync(
                `curl -sf -H "Accept: application/vnd.github.v3+json" "${repoUrl}"`,
                { encoding: 'utf-8' }
              );
              const repo = JSON.parse(repoResponse);
              if (repo.private) {
                console.error(`  FAIL: Repository is private`);
                hasErrors = true;
                continue;
              }
              console.log('  OK: Repository is public');

              // Check furchain.json exists and contains the character
              const furchainUrl = `https://api.github.com/repos/${entry.owner}/${entry.repo}/contents/furchain.json`;
              const furchainResponse = execSync(
                `curl -sf -H "Accept: application/vnd.github.raw+json" "${furchainUrl}"`,
                { encoding: 'utf-8' }
              );
              const furchain = JSON.parse(furchainResponse);
              const character = furchain.characters?.find(c => c.id === entry.id);
              if (!character) {
                console.error(`  FAIL: Character ${entry.id} not found in furchain.json`);
                hasErrors = true;
                continue;
              }
              console.log('  OK: Character found in furchain.json');

              // Check keys.json fingerprint matches
              const keysUrl = `https://api.github.com/repos/${entry.owner}/${entry.repo}/contents/keys/keys.json`;
              const keysResponse = execSync(
                `curl -sf -H "Accept: application/vnd.github.raw+json" "${keysUrl}"`,
                { encoding: 'utf-8' }
              );
              const keys = JSON.parse(keysResponse);
              const sigKey = keys.keys?.find(k => k.kid === keys.current?.sigKid && k.use === 'sig');
              if (!sigKey) {
                console.error(`  FAIL: No current signing key found in keys.json`);
                hasErrors = true;
                continue;
              }
              if (sigKey.fingerprint !== entry.fingerprint) {
                console.error(`  FAIL: Fingerprint mismatch`);
                console.error(`    Registry:  ${entry.fingerprint}`);
                console.error(`    keys.json: ${sigKey.fingerprint}`);
                hasErrors = true;
                continue;
              }
              console.log('  OK: Fingerprint matches');

              console.log(`  PASS: ${entry.display} verified`);
            } catch (e) {
              console.error(`  FAIL: Could not verify - ${e.message}`);
              hasErrors = true;
            }
          }

          if (hasErrors) {
            process.exit(1);
          }
          console.log('\nAll remote verifications passed.');
          SCRIPT
        env:
          ENTRY_FILES: ${{ steps.entries.outputs.files }}

      - name: Label PR as registration
        if: steps.entries.outputs.files != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ['registration'],
            });
