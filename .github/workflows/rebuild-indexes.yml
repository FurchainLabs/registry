name: Rebuild Derived Indexes

on:
  push:
    branches: [main]
    paths:
      - 'v1/by-id/**'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild derived indexes
        run: |
          node << 'SCRIPT'
          const fs = require('fs');
          const path = require('path');

          const byIdDir = 'v1/by-id';
          const byNameDir = 'v1/derived/by-name';
          const byOwnerDir = 'v1/derived/by-owner';

          // Clean derived directories
          for (const dir of [byNameDir, byOwnerDir]) {
            for (const f of fs.readdirSync(dir)) {
              if (f === '.gitkeep') continue;
              fs.unlinkSync(path.join(dir, f));
            }
          }

          // Read all entries
          const entries = [];
          for (const f of fs.readdirSync(byIdDir)) {
            if (f === '.gitkeep' || !f.endsWith('.json')) continue;
            try {
              const entry = JSON.parse(fs.readFileSync(path.join(byIdDir, f), 'utf-8'));
              entries.push(entry);
            } catch (e) {
              console.error(`Warning: skipping malformed file ${f}: ${e.message}`);
            }
          }

          console.log(`Processing ${entries.length} registry entries`);

          // Group by name
          const byName = new Map();
          for (const entry of entries) {
            const key = entry.name;
            if (!byName.has(key)) byName.set(key, []);
            byName.get(key).push(entry);
          }

          // Group by owner
          const byOwner = new Map();
          for (const entry of entries) {
            const key = entry.owner;
            if (!byOwner.has(key)) byOwner.set(key, []);
            byOwner.get(key).push(entry);
          }

          // Write by-name indexes
          for (const [name, nameEntries] of byName) {
            const sorted = nameEntries.sort((a, b) => a.registered.localeCompare(b.registered));
            fs.writeFileSync(
              path.join(byNameDir, `${name}.json`),
              JSON.stringify(sorted, null, 2) + '\n'
            );
          }
          console.log(`Wrote ${byName.size} by-name indexes`);

          // Write by-owner indexes
          for (const [owner, ownerEntries] of byOwner) {
            const sorted = ownerEntries.sort((a, b) => a.name.localeCompare(b.name));
            fs.writeFileSync(
              path.join(byOwnerDir, `${owner}.json`),
              JSON.stringify(sorted, null, 2) + '\n'
            );
          }
          console.log(`Wrote ${byOwner.size} by-owner indexes`);

          console.log('Done.');
          SCRIPT

      - name: Commit and push derived indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add v1/derived/
          if git diff --cached --quiet; then
            echo "No changes to derived indexes"
          else
            git commit -m "chore: rebuild derived indexes"
            git push
          fi
